# experiments/CUP/configs/cup_coarse.yaml

selection:
  top_k: 10  # Teniamo i migliori 5 per il refinement
  refine:
    steps: 5
    sig_digits: 1 # Maggiore precisione per la regressione
    rules:
      optim.lr: {clip: [1e-5, 0.1]}
      regularizer.l2: {clip: [0, 1e-1]}
      model.dropout: {clip: [0.0, 0.8]}
      optim.momentum: {clip: [0.4, 0.99]}

base:
  seed: 42

  data:
    # Questo file verrà creato dal notebook (80% del dataset originale)
    train_path: "data/CUP/internal_train_80.csv"
    # Assumiamo che il DataParser legga automaticamente input=10 e output=4 dal CSV
    normalize: true
    normalize_target: true
    inputs: 12
    targets: 4
  # Split per la Coarse Search (Hold-out)
  split:
    val_size: 0.20  # Su 400 righe di train, 100 vanno in validazione (25%)
    stratified: false # OBBLIGATORIO false per regressione

  # K-Fold per la Fine Search (Refinement)
  cv:
    k: 5 # 4-Fold su 400 righe = 100 val per fold.
    shuffle: true
    seed: 42

  # Default model architecture
  model:
    hidden_units: [20, 20]
    activation: "tanh" # Tanh o Relu vanno bene per regressione
    output_activation: "linear" # FONDAMENTALE: l'output non deve essere schiacciato
    dropout: 0.0

  # Optimizer defaults
  optim:
    name: "sgd"
    lr: 0.01
    momentum: 0.8

  # Regularizer defaults
  regularizer:
    l2: 1e-4

  # Training defaults
  training:
    epochs: 800 # Abbastanza per convergenza coarse
    batch_size: 32
    shuffle: true
    loss: "mee"   # Mean Eculidean Error per il training
    metric: "mee" # Mean Euclidean Error per la valutazione (o "mse")
    include_reg_in_val: false

  # Callbacks
  callbacks:
    early_stopping: true
    monitor: "val_loss"
    patience: 50 # Un po' più paziente per la regressione che può oscillare
    min_delta: 1e-5
    mode: "min"
    restore_best_weights: true
    verbose: 0

# ----------------------------
# GRID: COARSE SEARCH SPACE
# ----------------------------
grid:

  # 1) Architectures
  # Il CUP è più complesso del MONK. Proviamo reti più capaci.
  model.hidden_units:
      - [8, 6]
      - [8]
    # - [32, 32]      # Media profondità
    # - [16, 32, 16]
    # - [32, 16, 8]  # Profonda
    # - [128, 64, 32] # Funnel (imbuto)

  # 2) Activation
  model.activation: ["tanh", "relu"]

  # 3) Regularization (Cruciale con pochi dati - 400 sample)
  model.dropout: [0.0, 0.2, 0.5]
  regularizer.l2: [1e-4, 1e-3, 1e-2, 1e-1]

  # 4) Optimizer
  optim.name: ["sgd"] # Focalizziamoci su SGD+Momentum che spesso generalizza meglio
  
  # I Learning Rate per regressione sono spesso più bassi
  optim.lr: [0.1, 0.01, 0.001]  
  
  optim.momentum: [0.2, 0.6, 0.9]

  # 5) Training
  training.batch_size: [16, 32, 64] 
  # Batch piccolo (16) aiuta a generalizzare ("noise" nel gradiente), 
  # batch grande (32) stabilizza.