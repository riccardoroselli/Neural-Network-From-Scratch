# experiments/CUP/configs/cup_coarse.yaml

selection:
  top_k: 10  # keep the best 10 coarse configs for the refinement phase
  refine:
    steps: 5
    sig_digits: 1
    rules:
      optim.lr: {clip: [1.0e-5, 0.1]}
      regularizer.l2: {clip: [0, 1.0e-1]}
      model.dropout: {clip: [0.0, 0.8]}
      optim.momentum: {clip: [0.0, 0.99]}

base:
  seed: 42

  data:
    # 80% of ML-CUP25-TR (425 rows), produced by create_internal_split.
    train_path: "data/CUP/internal_train_80.csv"
    # 12 input columns and 4 target columns, per the ML-CUP25 format.
    normalize: true
    normalize_target: true
    inputs: 12
    targets: 4
  # Hold-out split for the coarse search
  split:
    val_size: 0.20  # of 425 training rows: 340 train / 85 validation
    stratified: false # must be false for regression

  # K-fold for the fine search (refinement)
  cv:
    k: 5 # 5 folds over 425 rows = 340 train / 85 validation per fold
    shuffle: true
    seed: 42

  # Default model architecture
  model:
    hidden_units: [20, 20]
    activation: "tanh"
    # NOTE: output_activation is not read by build_model_from_cfg; the
    # regression branch always uses a linear (Identity) output.
    output_activation: "linear"
    dropout: 0.0

  # Optimizer defaults
  optim:
    name: "sgd"
    lr: 0.01
    momentum: 0.8

  # Regularizer defaults
  regularizer:
    l2: 1.0e-4

  # Training defaults
  training:
    epochs: 800
    batch_size: 32
    shuffle: true
    # NOTE: neither key is read by build_model_from_cfg; the regression
    # branch always trains on MSE and reports MEE as the metric.
    loss: "mee"
    metric: "mee"
    include_reg_in_val: false

  # Callbacks
  callbacks:
    early_stopping: true
    monitor: "val_loss"
    patience: 50 # regression validation curves oscillate more than MONK's
    min_delta: 1.0e-5  # needs the decimal point, or YAML parses it as a string
    mode: "min"
    restore_best_weights: true
    verbose: 0

# ----------------------------
# GRID: COARSE SEARCH SPACE
# ----------------------------
grid:

  # 1) Architectures (wider than MONK: the CUP task is harder)
  model.hidden_units:
      - [8]
      - [8, 6]
      - [24, 12]
      - [24, 12, 6]
      - [64, 32, 16]
      - [24, 48, 24]
    # - [32, 32]      # Media profondità
    # - [16, 32, 16]
    # - [32, 16, 8]  # Profonda
    # - [128, 64, 32] # Funnel (imbuto)

  # 2) Activation
  model.activation: ["tanh", "relu", "sigmoid"]

  # 3) Regularization (important with only 425 training rows)
  model.dropout: [0.0, 0.2, 0.5]
  regularizer.l2: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]

  # 4) Optimizer
  optim.name: ["sgd"] # SGD + momentum only
  
  # Regression usually wants smaller learning rates than classification
  optim.lr: [0.1, 0.01, 0.001]
  
  optim.momentum: [0.5, 0.9]

  # 5) Training
  training.batch_size: [16, 32, 64]
  # Small batches add gradient noise and can help generalization;
  # larger batches give a more stable descent direction.