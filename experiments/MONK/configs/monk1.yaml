# experiments/MONK/configs/monkX.yaml
# Use for MONK1 / MONK2 / MONK3 by changing data.train_path.
#
# This config is intentionally "large but sane":
# - multiple architectures via model.hidden_units (supports multi-layer MLPs)
# - activation choices (single activation applied to all hidden layers)
# - dropout + L2 regularization
# - SGD vs Adam, momentum sweep (when using SGD)
# - batch size sweep
#
# Your pipeline:
# - coarse: holdout split
# - fine: k-fold CV on top-K
#
# Make sure your code reads:
# - base.seed
# - data.train_path
# - split (holdout)
# - cv (kfold)
# - model / optim / regularizer / callbacks / training
# - grid (dot-path overrides)

selection:
  top_k: 10
  refine:
    steps: 5
    sig_digits: 1
    rules:
      optim.lr: {clip: [1e-4, 1.0]}
      regularizer.l2: {clip: [0.0, 1e-2]}
      model.dropout: {clip: [0.0, 0.8]}
      optim.momentum: {clip: [0.0, 0.99]}

base:
  seed: 42

  data:
    # Set this per dataset:
    # MONK-1: data/MONK/MONK1/monks-1.train
    # MONK-2: data/MONK/MONK2/monks-2.train
    # MONK-3: data/MONK/MONK3/monks-3.train
    train_path: "data/MONK/MONK1/monks-1.train"

  # Holdout split for coarse search
  split:
    val_size: 0.2
    stratified: true

  # K-Fold settings for fine search
  cv:
    k: 3
    shuffle: true
    seed: 42

  # Default model (will be overridden by grid combos)
  model:
    # int OR list[int]  (list enables multiple hidden layers)
    hidden_units: [8]
    activation: "tanh"
    dropout: 0.0

  # Optimizer defaults (overridden by grid)
  optim:
    # name supports "sgd" or "adam" in the generic factory
    name: "sgd"
    lr: 0.1
    momentum: 0.0

  # Regularizer defaults
  regularizer:
    l2: 0.0

  # Early stopping (used in both coarse and kfold training)
  callbacks:
    early_stopping: true
    monitor: "val_loss"
    patience: 40
    min_delta: 0.0
    mode: "auto"
    restore_best_weights: true
    verbose: 0

  # Training defaults
  training:
    epochs: 1000
    batch_size: 16
    shuffle: true
    include_reg_in_val: false

# ----------------------------
# GRID: COARSE SEARCH SPACE
# ----------------------------
# If this is too large, reduce:
# - architectures list
# - optimizer combinations (choose only SGD or only Adam)
# - dropout levels
# - l2 levels
# - learning rates
grid:

  # ----------------------------
  # 1) Architectures (MOST important)
  # ----------------------------
  # For MONK you typically don’t need very deep networks.
  # This list covers:
  # - single-layer small/medium/large
  # - two-layer "funnel" and "wide->narrow"
  # - a few 3-layer small nets (optional)
  #
  # You can comment out the 3-layer ones if runtime explodes.
  model.hidden_units:
    # 1 hidden layer
    # - [2]
    - [4]
    # - [6]
    - [8]
    # - [12]
    # - [16]
    # - [24]
    # - [32]

    # 2 hidden layers (common sweet spot)
    - [8, 4]
    # - [12, 6]
    # - [16, 8]
    # - [24, 12]
    # - [32, 16]

    # 2 hidden layers (same width)
    # - [4, 4]
    # - [16, 16]
    # - [24, 24]

    # 3 hidden layers (OPTIONAL: comment out if too slow)
    # - [16, 8, 4]
    # - [24, 12, 6]
    # - [32, 16, 8]

  # ----------------------------
  # 2) Activation (single activation for all hidden layers)
  # ----------------------------
  model.activation: ["tanh", "relu", "sigmoid"]

  # ----------------------------
  # 3) Regularization knobs
  # ----------------------------
  # Dropout works well especially for MONK-3 noise
  model.dropout: [0.0, 0.2]

  # L2 can stabilize / improve generalization
  regularizer.l2: [0.0, 1e-1, 1e-3, 1e-2]

  # ----------------------------
  # 4) Optimizer sweep
  # ----------------------------
  # If you want to keep it smaller:
  # - choose just SGD (and momentum) OR just Adam.
  optim.name: ["sgd"]

  # Learning rate (broad range)
  # SGD often likes bigger LR than Adam
  optim.lr: [0.1, 0.2, 0.01]

  # Momentum only matters for SGD. For Adam it’s ignored in our factory.
  optim.momentum: [0.0, 0.1, 0.9]

  # ----------------------------
  # 5) Training hyperparams
  # ----------------------------
  training.batch_size: [16, 32]
  training.epochs: [800]
